services:
  - type: web
    name: ecommerce-data-quality
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m pytest -q
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 --access-logfile - --error-logfile -
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL_CA
        sync: false
